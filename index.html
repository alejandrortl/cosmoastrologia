<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosmoastrología</title>
  <meta name="description" content="Curso de astronomía y astrología comparada: lo que se observa en el cielo y cómo lo explica cada cosmovisión.">
  <meta name="theme-color" content="#14203a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <script>
    try { var t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try {
      var l = parseFloat(localStorage.getItem('letra'));
      if (l > 0) {
        document.documentElement.style.fontSize = (l * 100) + '%';
        if (l >= 1.4) document.documentElement.dataset.letraGrande = '';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <a class="saltar" href="#principal">Ir al contenido</a>
  <header class="cabecera">
    <a class="marca" href="/" data-enlace>Cosmoastrología</a>
    <div class="herramientas">
      <div class="tamano-letra" role="group" aria-label="Tamaño de letra">
        <button class="boton-letra" type="button" data-letra="-1" aria-label="Letra más pequeña">A<span aria-hidden="true">−</span></button>
        <button class="boton-letra mayor" type="button" data-letra="1" aria-label="Letra más grande">A<span aria-hidden="true">+</span></button>
      </div>
      <button class="boton-tema" type="button" aria-label="Cambiar entre modo noche y modo día">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
    <p class="aviso-letra" aria-live="polite"></p>
  </header>
  <main id="principal" tabindex="-1"></main>
  <div id="reproductor" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
