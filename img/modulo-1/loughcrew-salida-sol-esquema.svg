<text x="40" y="880" font-size="20" fill="#444">Ángulos desde el norte, calculados para 53,7° N con el horizonte llano.</text><text x="40" y="908" font-size="20" fill="#444">La línea roja es la dirección de la luz que, según Prendergast, llega a la cámara 6. Esquema.</text>
