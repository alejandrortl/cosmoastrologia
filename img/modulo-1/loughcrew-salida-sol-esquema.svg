<text x="40" y="50" font-size="30" font-weight="bold" fill="#222">Por dónde sale el Sol a lo largo del año en Loughcrew</text>
<text x="40" y="84" font-size="22" fill="#444">Vista desde arriba, con el norte hacia arriba. El este queda a la derecha.</text>
<path d="M190,160 A320,320 0 0 1 190,800" fill="none" stroke="#8c8c8c" stroke-width="3" stroke-dasharray="8 8"/><line x1="190" y1="480" x2="426.8" y2="264.8" stroke="#c98a00" stroke-width="4"/><circle cx="426.8" cy="264.8" r="20" fill="#ffd34d" stroke="#c98a00" stroke-width="4"/><text x="456.4" y="231.9" font-size="23" font-weight="bold" fill="#c98a00">21 de junio</text><text x="456.4" y="259.9" font-size="21" fill="#333">solsticio de verano · 48°</text><line x1="190" y1="480" x2="510.0" y2="480.0" stroke="#6a7d2a" stroke-width="4"/><circle cx="510.0" cy="480.0" r="20" fill="#ffd34d" stroke="#6a7d2a" stroke-width="4"/><text x="550.0" y="474.0" font-size="23" font-weight="bold" fill="#6a7d2a">20 de marzo y 23 de sept.</text><text x="550.0" y="502.0" font-size="21" fill="#333">equinoccios · 90°</text><line x1="190" y1="480" x2="471.7" y2="631.9" stroke="#b4361f" stroke-width="4"/><circle cx="471.7" cy="631.9" r="20" fill="#ffd34d" stroke="#b4361f" stroke-width="4"/><text x="506.9" y="644.8" font-size="23" font-weight="bold" fill="#b4361f">principios de nov. y de feb.</text><text x="506.9" y="672.8" font-size="21" fill="#333">Samhain e Imbolc · 118°</text><line x1="190" y1="480" x2="426.8" y2="695.2" stroke="#2f5d8a" stroke-width="4"/><circle cx="426.8" cy="695.2" r="20" fill="#ffd34d" stroke="#2f5d8a" stroke-width="4"/><text x="456.4" y="716.1" font-size="23" font-weight="bold" fill="#2f5d8a">21 de diciembre</text><text x="456.4" y="744.1" font-size="21" fill="#333">solsticio de invierno · 132°</text><g transform="rotate(28.3 190 480)"><circle cx="190" cy="480" r="60" fill="#cbbba0" stroke="#6b5a40" stroke-width="3"/><rect x="160" y="471" width="95" height="18" fill="#6b5a40"/></g><text x="190" y="575" text-anchor="middle" font-size="22" fill="#333">Cairn L</text><text x="190" y="142" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">N</text><text x="190" y="840" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">S</text><text x="522" 